<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ПК ЭФФЕКТ · Корпоративный профиль</title>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="assets/fonts.css">
<style>
/* Layout: full-height app — toolbar on top, book stage in the middle, slide-in panel for contents/search, footer scrubber */
:root{
  --bg:#e6ecef; --stage:#d5dee3; --surface:#f7fafb; --fg:#15262f; --muted:#5b6d77; --line:#c3cfd6;
  --accent:#1f6f8b; --accent-ink:#ffffff; --hl:rgba(255,196,0,.45); --paper:#ffffff; --paper-ink:#1d2328;
  --ui:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"PT Serif",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f181d; --stage:#0b1216; --surface:#16232a; --fg:#e3ecf0; --muted:#8fa3ad; --line:#26363f;
  --accent:#5fb3cf; --accent-ink:#06222c; --hl:rgba(255,196,0,.45); --paper:#fbfbf9; --paper-ink:#1d2328; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f181d; --stage:#0b1216; --surface:#16232a; --fg:#e3ecf0; --muted:#8fa3ad; --line:#26363f;
  --accent:#5fb3cf; --accent-ink:#06222c; --hl:rgba(255,196,0,.45); --paper:#fbfbf9; --paper-ink:#1d2328; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* toolbar */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
.title{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.title b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.grp{display:flex;align-items:center;gap:4px}
.btn{height:34px;min-width:34px;padding:0 10px;border:1px solid var(--line);background:var(--bg);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.langs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.langs button{border:0;background:var(--bg);height:32px;padding:0 12px;font-weight:600;letter-spacing:.05em}
.langs button+button{border-left:1px solid var(--line)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.langs button:disabled{color:var(--muted);cursor:not-allowed}
.zoomv{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}

/* main */
.main{flex:1;min-height:0;display:flex;position:relative}
.stage{flex:1;min-width:0;position:relative;background:var(--stage);display:flex;align-items:center;justify-content:center;padding:16px 56px}
.bookwrap{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.book{margin:0 auto}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:40px;height:64px;border-radius:8px;border:1px solid var(--line);background:var(--surface);opacity:.85;display:flex;align-items:center;justify-content:center}
.nav svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:2}
.nav.prev{left:max(8px,env(safe-area-inset-left,0px))}.nav.next{right:max(8px,env(safe-area-inset-right,0px))}

/* pages */
.page{background:var(--paper);color:var(--paper-ink);overflow:hidden;container-type:inline-size}
.page img{position:relative;width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}
.ov{position:absolute;inset:0;pointer-events:none}
.ov a{position:absolute;pointer-events:auto;border-radius:2px}
.ov a:hover{background:rgba(31,111,139,.14);outline:1px solid rgba(31,111,139,.5)}
.ov .h{position:absolute;background:var(--hl);mix-blend-mode:multiply;border-radius:1px}
.ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa;font-size:12px}

/* text pages (RU) */
.tp{position:absolute;inset:0;padding:7cqw 8cqw 9cqw;font-family:var(--serif);font-size:calc(2.55cqw * var(--fs,1));line-height:1.42;hyphens:auto;text-align:justify}
.tp p{margin:0 0 .55em}
.tp .run{position:absolute;top:3cqw;left:8cqw;right:8cqw;font-family:var(--ui);font-size:1.7cqw;letter-spacing:.06em;text-transform:uppercase;color:#7b8a92;border-bottom:1px solid #d9e0e4;padding-bottom:1cqw;text-align:left}
.tp .num{position:absolute;bottom:3.5cqw;right:8cqw;font-family:var(--ui);font-size:2.2cqw;color:#7b8a92}
.tp p.hd{font-family:var(--ui);font-weight:700;color:#1f5f78;text-align:left;font-size:1.25em;line-height:1.25;margin-top:.4em}
.tp mark{background:var(--hl);color:inherit}
.cover{position:absolute;inset:0;background:linear-gradient(170deg,#1f5f78 0%,#123a4b 60%,#0b2733 100%);color:#fff;padding:12cqw 10cqw;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--ui)}
.cover h1{font-size:8.5cqw;line-height:1.05;margin:0;letter-spacing:.01em;text-wrap:balance}
.cover h2{font-size:3.6cqw;font-weight:500;line-height:1.3;margin:4cqw 0 0;opacity:.9;text-wrap:balance}
.cover small{font-size:2.6cqw;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.cover .ice{height:30cqw;background:repeating-linear-gradient(120deg,rgba(255,255,255,.08) 0 2cqw,transparent 2cqw 5cqw);border-top:1px solid rgba(255,255,255,.3)}

/* side panel */
.panel{width:340px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panel[hidden]{display:none}
.ptabs{display:flex;border-bottom:1px solid var(--line)}
.ptabs button{flex:1;border:0;background:none;padding:12px 8px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.ptabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{flex:1;overflow:auto;padding:8px 0 24px}
.toc a{display:flex;gap:10px;justify-content:space-between;padding:7px 16px;text-decoration:none;color:var(--fg);line-height:1.3}
.toc a:hover,.toc a.cur{background:var(--bg)}
.toc a.cur{box-shadow:inset 3px 0 0 var(--accent)}
.toc a.l0{font-weight:600;margin-top:4px}
.toc a.l1{padding-left:30px}
.toc a.l2{padding-left:44px;color:var(--muted);font-size:13px}
.toc a .pg{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400;flex:none}
.sbox{padding:12px 16px;display:flex;gap:6px}
.sbox input{flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px}
.sinfo{padding:0 16px 8px;color:var(--muted);font-size:12px}
.res a{display:block;padding:9px 16px;text-decoration:none;color:var(--fg);border-top:1px solid var(--line);line-height:1.4}
.res a:hover{background:var(--bg)}
.res a b{font-size:12px;color:var(--accent);display:block;letter-spacing:.03em}
.res mark{background:var(--hl);color:inherit;border-radius:2px}

/* footer */
.foot{display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-top:1px solid var(--line)}
.foot input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.pgbox{display:flex;align-items:center;gap:6px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pgbox input{width:52px;height:30px;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.note{font-size:12px;color:var(--muted);max-width:360px;line-height:1.3}

/* zoom view */
.zoom{position:absolute;inset:0;z-index:20;background:var(--stage);overflow:auto;-webkit-overflow-scrolling:touch}
.zoom .zin{display:flex;gap:12px;padding:16px;width:max-content;margin:0 auto}
.zoom .page{position:relative;flex:none;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.zclose{position:absolute;z-index:25;top:12px;right:max(12px,env(safe-area-inset-right,0px));z-index:21}

@media (max-width:760px){
  .panel{position:absolute;inset:0 0 0 auto;width:100%;z-index:30}
  .hide-s{display:none}
  .nav{width:32px;height:52px}
  .stage{padding:8px 36px}
  .note{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="app">
  <header class="bar">
    <button class="btn" id="bToc" aria-pressed="false" title="Оглавление и поиск">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="hide-s">Оглавление</span>
    </button>
    <div class="title"><b id="docTitle">ПК ЭФФЕКТ</b><span id="docSub">Корпоративный профиль</span></div>
    <div class="grp">
      <button class="btn" id="bSearch" title="Поиск"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
      <button class="btn" id="zMinus" title="Уменьшить"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <span class="zoomv" id="zVal">100%</span>
      <button class="btn" id="zPlus" title="Увеличить"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="btn hide-s" id="bFull" title="Во весь экран"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </header>

  <div class="main">
    <div class="stage" id="stage">
      <button class="nav prev" id="prev" aria-label="Предыдущая страница"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
      <div class="bookwrap" id="bookwrap"></div>
      <button class="nav next" id="next" aria-label="Следующая страница"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
      <button class="btn zclose" id="zClose" hidden>Закрыть увеличение</button>
      <div class="zoom" id="zoom" hidden>
        <div class="zin" id="zin"></div>
      </div>
    </div>
    <aside class="panel" id="panel" hidden>
      <div class="ptabs" role="tablist">
        <button role="tab" id="tToc" aria-selected="true">Оглавление</button>
        <button role="tab" id="tFind" aria-selected="false">Поиск</button>
        <button role="tab" id="tClose" aria-label="Закрыть панель" style="flex:0 0 48px">✕</button>
      </div>
      <div class="pbody" id="pToc"><nav class="toc" id="toc"></nav></div>
      <div class="pbody" id="pFind" hidden>
        <form class="sbox" id="sForm"><input id="q" type="search" placeholder="Слово или фраза" autocomplete="off"><button class="btn" type="submit">Найти</button></form>
        <div class="sinfo" id="sInfo"></div>
        <div class="res" id="res"></div>
      </div>
    </aside>
  </div>

  <footer class="foot">
    <div class="pgbox">стр. <input id="pg" inputmode="numeric" aria-label="Номер страницы"> <span id="pgN">/ 94</span></div>
    <input type="range" id="scrub" min="1" max="94" value="1" aria-label="Перейти к странице">
    <div class="note" id="note"></div>
  </footer>
</div>

<script src="assets/page-flip.browser.js"></script>
<script>
const $ = s => document.querySelector(s);
const NOTES = {
  en: '← → turn pages · double-click to zoom · Ctrl+F to search',
  ru: '← → листать · двойной щелчок — увеличить · Ctrl+F — поиск'
};
const data = {}; let lang = 'ru', pf = null, cur = 0, zoom = 1, query = '';

function cap(s){ const i = s.search(/\p{L}/u); return i < 0 ? s : s.slice(0,i) + s[i].toUpperCase() + s.slice(i+1); }
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function norm(s){ return s.toLowerCase().replace(/ё/g,'е'); }

/* data/<lang>.js sets window.FLIPDATA[lang]; script tags also work when opened from disk (file://) */
function load(l){
  if (data[l]) return Promise.resolve(data[l]);
  return new Promise((ok, fail) => {
    const s = document.createElement('script'); s.src = 'data/' + l + '.js';
    s.onload = () => ok(data[l] = window.FLIPDATA[l]); s.onerror = fail;
    document.head.appendChild(s);
  });
}

/* ---------- page DOM ---------- */
function imgSrc(i){ const d = data[lang]; return lang + '/p-' + String(i+1).padStart(d.n >= 100 ? 3 : 2,'0') + '.jpg'; }
function buildPage(d, i, forZoom){
  const el = document.createElement('div');
  el.className = 'page'; el.dataset.i = i;
  if (i === 0 || i === d.n - 1) el.dataset.density = 'hard';
  if (d.kind === 'pdf'){
    el.innerHTML = '<div class="ld">' + (i+1) + '</div><img alt="Страница ' + (i+1) + '" draggable="false"><div class="ov"></div>';
    if (forZoom) el.querySelector('img').src = imgSrc(i);
    drawOverlay(d, i, el.querySelector('.ov'));
  } else {
    el.innerHTML = ruHTML(d, i);
  }
  return el;
}
function drawOverlay(d, i, ov){
  const p = d.pages[i]; let h = '';
  for (const k of p.lk){
    const [x0,y0,x1,y1] = k.r;
    const st = `left:${x0/10}%;top:${y0/10-0.3}%;width:${(x1-x0)/10}%;height:${(y1-y0)/10+0.6}%`;
    h += k.url ? `<a href="${esc(k.url)}" target="_blank" rel="noopener" style="${st}" title="${esc(k.url)}"></a>`
               : `<a href="#" data-go="${k.page}" style="${st}" title="Перейти на стр. ${k.page+1}"></a>`;
  }
  for (const w of hitWords(d, i)) h += `<div class="h" style="left:${w[1]/10}%;top:${w[2]/10}%;width:${(w[3]-w[1])/10}%;height:${(w[4]-w[2])/10}%"></div>`;
  ov.innerHTML = h;
}
const runTitle = '';
function ruHTML(d, i){
  const p = d.pages[i];
  const body = p.p.map(t => {
    const hd = t.length < 90 && t === t.toUpperCase() && /\p{L}{3}/u.test(t);
    return `<p${hd ? ' class="hd"' : ''}>${mark(hd ? cap(t.toLowerCase()) : t)}</p>`;
  }).join('');
  return `<div class="tp" style="--fs:${p.fs||1}"><div class="run">${runTitle}</div>${body}<div class="num">${p.label}</div></div>`;
}
function mark(t){
  const e = esc(t);
  if (!query) return e;
  const q = query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/е/g,'[её]');
  return e.replace(new RegExp(q,'gi'), m => '<mark>' + m + '</mark>');
}

/* fit RU text to page: measure once at a reference width, store a font multiplier */
function fitRU(d){
  const box = document.createElement('div');
  box.style.cssText = 'position:absolute;left:-9999px;top:0;width:500px;height:707px';
  box.className = 'page'; document.body.appendChild(box);
  d.pages.forEach((p, i) => {
    if (p.cover) return;
    p.fs = 1; box.innerHTML = ruHTML(d, i);
    const tp = box.firstChild; let fs = 1;
    while (tp.scrollHeight > tp.clientHeight + 1 && fs > 0.55){ fs -= 0.04; tp.style.setProperty('--fs', fs); }
    p.fs = +fs.toFixed(2);
  });
  box.remove();
}

/* ---------- search ---------- */
function pageText(d, i){
  const p = d.pages[i];
  if (!p._t){
    if (d.kind === 'pdf'){ let s = '', off = []; for (const w of p.w){ off.push(s.length); s += w[0] + ' '; } p._t = norm(s); p._off = off; }
    else p._t = norm((p.p || []).join(' '));
  }
  return p._t;
}
function hitWords(d, i){
  if (!query || d.kind !== 'pdf') return [];
  const t = pageText(d, i), q = norm(query), p = d.pages[i], out = [];
  let pos = t.indexOf(q);
  while (pos >= 0){
    const end = pos + q.length;
    p._off.forEach((o, k) => { const e = o + p.w[k][0].length; if (o < end && e > pos) out.push(p.w[k]); });
    pos = t.indexOf(q, end);
  }
  return out;
}
function runSearch(){
  query = $('#q').value.trim();
  const d = data[lang], res = $('#res'); res.innerHTML = '';
  if (query.length < 2){ $('#sInfo').textContent = 'Введите не меньше двух символов.'; refreshMarks(); return; }
  const q = norm(query); let total = 0, html = '';
  for (let i = 0; i < d.n; i++){
    const t = pageText(d, i); let pos = t.indexOf(q), c = 0, first = pos;
    while (pos >= 0){ c++; pos = t.indexOf(q, pos + q.length); }
    if (!c) continue; total += c;
    const a = Math.max(0, first - 60), snip = t.slice(a, first + q.length + 80);
    const lbl = d.pages[i].label ? 'стр. ' + d.pages[i].label : 'стр. ' + (i+1);
    html += `<a href="#" data-go="${i}"><b>${lbl} · совпадений: ${c}</b>${a?'…':''}${esc(snip).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'), m=>'<mark>'+m+'</mark>')}…</a>`;
  }
  $('#sInfo').textContent = total ? `Найдено ${total} совпадений на ${res.childElementCount || (html.match(/data-go/g)||[]).length} страницах` : 'Ничего не найдено.';
  res.innerHTML = html;
  refreshMarks();
}
function refreshMarks(){
  const d = data[lang];
  document.querySelectorAll('#bookwrap .page, #zin .page').forEach(el => {
    const i = +el.dataset.i;
    if (d.kind === 'pdf') drawOverlay(d, i, el.querySelector('.ov'));
    else { const tp = el.querySelector('.tp'); if (tp) tp.outerHTML = ruHTML(d, i); }
  });
}

/* ---------- book ---------- */
function ensureImgs(i){
  if (data[lang].kind !== 'pdf' || !pf) return;
  const pages = document.querySelectorAll('#bookwrap .page');
  for (let k = Math.max(0, i-3); k <= Math.min(pages.length-1, i+5); k++){
    const img = pages[k].querySelector('img'); if (img && !img.src) img.src = imgSrc(k);
  }
}
async function openBook(l, at){
  lang = l; const d = await load(l);
  if (d.kind !== 'pdf' && !d._fit){ await document.fonts.ready; fitRU(d); d._fit = 1; }
  if (pf){ try{ pf.destroy(); }catch(e){} pf = null; }
  const wrap = $('#bookwrap'); wrap.innerHTML = '';
  const book = document.createElement('div'); book.className = 'book'; wrap.appendChild(book);
  const pages = []; for (let i = 0; i < d.n; i++) pages.push(buildPage(d, i));
  const W = wrap.clientWidth, H = wrap.clientHeight, R = 1.414;
  const two = W > H * 1.1;
  const pw = Math.floor(Math.min(two ? W / 2 : W, H / R));
  book.style.width = (two ? pw * 2 : pw) + 'px'; book.style.height = Math.floor(pw * R) + 'px';
  pf = new St.PageFlip(book, {
    width: pw, height: Math.floor(pw * R), size: 'fixed',
    showCover: true, usePortrait: true, mobileScrollSupport: false, maxShadowOpacity: .4, flippingTime: 700,
    startPage: Math.min(at || 0, d.n - 1)
  });
  pf.loadFromHTML(pages);
  pf.on('flip', e => { cur = e.data; sync(); ensureImgs(cur); });
  pf.on('changeOrientation', () => sync());
  cur = pf.getCurrentPageIndex(); ensureImgs(cur);
  $('#docTitle').textContent = d.title;
  $('#docSub').textContent = 'Корпоративный профиль';
  $('#note').textContent = NOTES[l];
  $('#scrub').max = d.n; $('#pgN').textContent = '/ ' + d.n;
  document.documentElement.lang = l;
  buildToc(d); if (query) runSearch(); sync();
}
function go(i){
  const d = data[lang]; i = Math.max(0, Math.min(d.n - 1, i));
  if (!$('#zoom').hidden){ cur = i; renderZoom(); sync(); }
  if (pf){ ensureImgs(i); pf.turnToPage(i); cur = i; sync(); }
  if (matchMedia('(max-width:760px)').matches) togglePanel(false);
}
function sync(){
  const d = data[lang]; if (!d) return;
  $('#pg').value = cur + 1; $('#scrub').value = cur + 1;
  let best = null;
  document.querySelectorAll('#toc a').forEach(a => { a.classList.remove('cur'); if (+a.dataset.go <= cur) best = a; });
  if (best) best.classList.add('cur');
}
function buildToc(d){
  $('#toc').innerHTML = d.toc.map(t => {
    const lbl = d.pages[t.p] && d.pages[t.p].label;
    return `<a href="#" class="l${t.l}" data-go="${t.p}"><span>${esc(cap(t.t))}</span><span class="pg">${lbl || ''}</span></a>`;
  }).join('');
}

/* ---------- zoom ---------- */
function spread(){
  if (!pf) return [cur];
  const portrait = pf.getOrientation() === 'portrait', d = data[lang];
  if (portrait || cur === 0 || cur === d.n - 1) return [cur];
  const l = cur % 2 ? cur : cur - 1; return [l, l + 1].filter(x => x < d.n);
}
function renderZoom(){
  const d = data[lang], zin = $('#zin'), st = $('#stage');
  const ids = spread(), avail = st.clientWidth - 32;
  const base = Math.min(avail / ids.length - 12, (st.clientHeight - 32) / 1.414);
  zin.innerHTML = '';
  ids.forEach(i => { const el = buildPage(d, i, true); el.style.width = base * zoom + 'px'; el.style.height = base * zoom * 1.414 + 'px'; zin.appendChild(el); });
}
function setZoom(z){
  const old = zoom; zoom = Math.max(1, Math.min(4, Math.round(z * 4) / 4));
  $('#zVal').textContent = Math.round(zoom * 100) + '%';
  const zv = $('#zoom');
  $('#zClose').hidden = zoom === 1;
  if (zoom === 1){ zv.hidden = true; return; }
  const fx = zv.hidden ? .5 : (zv.scrollLeft + zv.clientWidth/2) / zv.scrollWidth, fy = zv.hidden ? 0 : (zv.scrollTop + zv.clientHeight/2) / zv.scrollHeight;
  zv.hidden = false; renderZoom();
  zv.scrollLeft = fx * zv.scrollWidth - zv.clientWidth/2; zv.scrollTop = fy * zv.scrollHeight - (old === 1 ? 0 : zv.clientHeight/2);
}

/* ---------- panel ---------- */
function togglePanel(show, tab){
  const p = $('#panel'); show = show ?? p.hidden; p.hidden = !show;
  $('#bToc').setAttribute('aria-pressed', show);
  if (tab){ $('#tToc').setAttribute('aria-selected', tab === 'toc'); $('#tFind').setAttribute('aria-selected', tab === 'find');
    $('#pToc').hidden = tab !== 'toc'; $('#pFind').hidden = tab !== 'find'; if (tab === 'find') setTimeout(() => $('#q').focus(), 30); }
  setTimeout(() => openBook(lang, cur), 30);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-go]');
  if (a){ e.preventDefault(); e.stopPropagation(); go(+a.dataset.go); }
}, true);
$('#prev').onclick = () => zoomOrFlip(-1);
$('#next').onclick = () => zoomOrFlip(1);
function zoomOrFlip(dir){
  if (!$('#zoom').hidden){ const s = spread(); go(dir > 0 ? s[s.length-1] + 1 : s[0] - 1); return; }
  dir > 0 ? pf.flipNext() : pf.flipPrev();
}
$('#bToc').onclick = () => togglePanel(undefined, 'toc');
$('#bSearch').onclick = () => togglePanel(true, 'find');
$('#tToc').onclick = () => togglePanel(true, 'toc');
$('#tFind').onclick = () => togglePanel(true, 'find');
$('#tClose').onclick = () => togglePanel(false);
$('#sForm').onsubmit = e => { e.preventDefault(); runSearch(); };
$('#zPlus').onclick = () => setZoom(zoom + .5);
$('#zMinus').onclick = () => setZoom(zoom - .5);
$('#zClose').onclick = () => setZoom(1);
$('#bookwrap').addEventListener('dblclick', () => setZoom(2));
$('#bFull').onclick = () => { const r = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : r.requestFullscreen?.())?.catch?.(() => {}); };
/* switching language keeps the reader in the same section (matched by position in the contents) */
async function switchLang(l){
  if (l === lang) return;
  const from = data[lang]; let k = -1;
  from.toc.forEach((t, i) => { if (t.p <= cur) k = i; });
  const to = await load(l);
  const share = k >= 0 ? k / from.toc.length : 0;
  const t = to.toc[Math.round(share * to.toc.length)] || to.toc[0];
  openBook(l, k >= 0 ? t.p + (cur - from.toc[k].p) : 0);
}
$('#pg').addEventListener('change', e => go((+e.target.value || 1) - 1));
$('#scrub').addEventListener('input', e => { $('#pg').value = e.target.value; });
$('#scrub').addEventListener('change', e => go(+e.target.value - 1));
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (e.key === 'ArrowRight') zoomOrFlip(1);
  else if (e.key === 'ArrowLeft') zoomOrFlip(-1);
  else if (e.key === 'Escape'){ setZoom(1); }
  else if (e.key === '+' || e.key === '=') setZoom(zoom + .5);
  else if (e.key === '-') setZoom(zoom - .5);
  else if ((e.ctrlKey || e.metaKey) && e.key === 'f'){ e.preventDefault(); togglePanel(true, 'find'); }
});
let rz; window.addEventListener('resize', () => {
  if (!$('#zoom').hidden) renderZoom();
  clearTimeout(rz); rz = setTimeout(() => openBook(lang, cur), 250);
});

openBook('ru', 0);
</script>
